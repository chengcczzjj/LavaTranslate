name: Build Windows x64
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify native Windows x64 runner
        run: node -e "if(process.platform!=='win32'||process.arch!=='x64')throw Error('Windows x64 runner required')"
      - run: npm ci
      - run: python -m pip install onnx
      - run: npm run models
      - run: npm run typecheck
      - run: npm run check:platform
      - run: npm run check:win-compat
      - run: node --test scripts/updater.test.mjs scripts/retain-platform-update.test.mjs scripts/offline-survey.test.mjs
      - name: Build Windows x64 NSIS installer and update manifest
        run: npm run dist
      - name: Verify packaged native modules and app-local VC++ runtime
        run: npm run check:win-package -- dist/win-unpacked
      - name: Verify update manifest and generate SHA256SUMS
        shell: pwsh
        run: |
          $exe = Get-Item dist/LavaTranslate-Setup-*.exe
          if (!(Test-Path dist/latest.yml) -or (Get-Item dist/latest.yml).Length -eq 0) { throw "Missing dist/latest.yml" }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Set-Content -Encoding ascii dist/SHA256SUMS-Windows.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: win-x64-release
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/LavaTranslate-Setup-*.exe
            dist/LavaTranslate-Setup-*.exe.blockmap
            dist/latest.yml
            dist/SHA256SUMS-Windows.txt
